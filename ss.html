<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secret Santa</title>
  <link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* General Styles */
body {
    font-family: 'Mountains of Christmas', cursive, Arial, sans-serif;
    margin: 0;
    padding: 0;
    text-align: center;
    background: linear-gradient(to bottom, #EAF7FF, #C2E9FB); /* Winter gradient */
    color: #2C3E50;
  }
  
  /* Header */
  header {
    background-color: #FF0000; /* Christmas red */
    color: #FFFFFF;
    padding: 1rem;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    font-size: 2rem;
    text-shadow: 1px 1px 4px #000;
  }
  
  /* Main Content */
  main {
    padding: 2rem;
  }
  
  #app {
    max-width: 600px;
    margin: 0 auto;
    background: rgba(255, 255, 255, 0.9);
    border-radius: 15px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    padding: 1rem;
    border: 2px solid #FFD700; /* Gold border */
  }
  
  /* List of Names */
  ul {
    list-style-type: none;
    padding: 0;
    margin: 1rem 0;
  }
  
  li {
    padding: 10px;
    margin: 10px 0;
    background: #FFFAF0; /* Light festive tone */
    border: 1px solid #FFD700; /* Gold */
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    color: #2C3E50;
    transition: transform 0.2s ease, background-color 0.2s ease;
  }
  
  li:hover {
    background-color: #FFEB3B; /* Yellow highlight */
    transform: scale(1.05);
  }
    
  button {
    margin-top: 20px; /* Add space above the button */
    padding: 15px 25px; /* Ensure button is visually prominent */
    font-size: 1.25rem; /* Increase font size for readability */
    background-color: #FF0000; /* Christmas red */
    color: white;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  button:hover {
    background-color: #CC0000; /* Darker red on hover */
    transform: scale(1.1); /* Slight zoom effect */
  }

  #done-section {
  display: none;
  font-size: 1.2rem;
  color: #2C3E50;
  background: rgba(255, 255, 255, 0.95);
  border-radius: 10px;
  padding: 1rem;
  border: 1px solid #FFD700; /* Gold border */
  box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
  text-align: center; /* Center content */
  margin-top: 20px;
}

    
  /* Result Section */
  #result-section {
    display: flex;
    flex-direction: column; /* Stack content vertically */
    align-items: center; /* Center content horizontally */
    justify-content: center; /* Center content vertically */
    height: 100%; /* Ensure full height for centering */
  }
  
  #result-section p {
    font-size: 2rem;
    color: #FF0000;
    margin: 0.5rem 0;
    text-shadow: 1px 1px 3px #FFD700;
  }
  
  #result-section strong {
    font-size: 2.5rem; /* Keep it large */
    color: #4CAF50; /* Green for Christmas theme */
    font-family: Arial, sans-serif; /* Clean sans-serif font */
    font-weight: bold; /* Emphasize the text */
    text-shadow: none; /* Remove shadow */
    letter-spacing: 0.5px; /* Add slight spacing for clarity */
  }
  
  
  #done-section {
    font-size: 1.2rem;
    color: #2C3E50;
    background: rgba(255, 255, 255, 0.95);
    border-radius: 10px;
    padding: 1rem;
    border: 1px solid #FFD700;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
  }
  
  /* Footer (Optional) */
  footer {
    margin-top: 2rem;
    font-size: 0.9rem;
    color: #2C3E50;
  }
  
  /* Extra Christmas Decor */
  body::before {
    content: "🎄";
    position: fixed;
    top: 10px;
    left: 10px;
    font-size: 2rem;
    z-index: 1;
  }
  
  body::after {
    content: "❄️";
    position: fixed;
    bottom: 10px;
    right: 10px;
    font-size: 2rem;
    z-index: 1;
  }
  #name-list {
    display: block; /* Name list is shown by default */
  }

  /* Style for the list of names */
  #name-list li {
    font-size: 1.5rem; /* Increase font size */
    padding: 15px 20px; /* Add more padding for a larger clickable area */
    margin: 10px 0; /* Add spacing between list items */
    background-color: #FFFAF0; /* Light festive background */
    border: 2px solid #FFD700; /* Gold border for a festive look */
    border-radius: 8px; /* Slightly rounded corners */
    cursor: pointer;
    transition: transform 0.2s ease, background-color 0.2s ease;
  }

  #name-list li:hover {
    background-color: #FFEB3B; /* Highlight on hover */
    transform: scale(1.05); /* Slight zoom effect on hover */
  }

  
  #result-section {
    display: none; /* Result section is hidden by default */
  }
  
  </style>
</head>
<body>
  <header>
    <h1>Secret Santa</h1>
  </header>
  <main>
    <div id="app">
      <ul id="name-list"></ul>
      <div id="result-section" class="hidden">
        <p id="assignment-result"></p>
        <button id="back-button">Back to List</button>
      </div>
      <div id="done-section" style="display: none;">
        <p id="done-message"></p>
        <button onclick="resetApp()">Start Over</button>
      </div>
      
    </div>
  </main>
  <script>

// Secret Santa Backtracking Implementation
const people = [
    { name: "Papa", restrictions: ["Mema"] },
    { name: "Mema", restrictions: ["Papa"] },
    { name: "Mark", restrictions: ["Nan", "Sheri"] },
    { name: "Nan", restrictions: ["Mark", "Sheri"] },
    { name: "Steve", restrictions: ["Jenny"] },
    { name: "Jenny", restrictions: ["Steve"] },
    { name: "Bryson", restrictions: ["Emily"] },
    { name: "Emily", restrictions: ["Bryson"] },
    { name: "Jon", restrictions: ["Carmen"] },
    { name: "Carmen", restrictions: ["Jon"] },
    { name: "Sheri", restrictions: ["Mark","Nan"] },
    { name: "Josh" },
  ];

// Backtracking algorithm to generate valid Secret Santa assignments
function generateAssignments(people) {
  const assignments = new Map(); // Stores giver -> recipient pairs
  const assignedRecipients = new Set(); // Tracks assigned recipients

  // Helper function to shuffle the list randomly
  function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1)); // Random index
      [array[i], array[j]] = [array[j], array[i]]; // Swap elements
    }
  }

  // Shuffle the recipients to add randomness
  const shuffledRecipients = [...people];
  shuffle(shuffledRecipients);

  function backtrack(index) {
    if (index === people.length) return true; // All assignments complete

    const giver = people[index];

    for (const recipient of shuffledRecipients) {
      if (
        recipient.name !== giver.name && // Not themselves
        !(giver.restrictions || []).includes(recipient.name) && // Not restricted
        !assignedRecipients.has(recipient.name) // Not already assigned
      ) {
        // Tentatively assign this recipient
        assignments.set(giver.name, recipient.name);
        assignedRecipients.add(recipient.name);

        // Recursively try to complete the rest of the assignments
        if (backtrack(index + 1)) return true;

        // Backtrack: undo the tentative assignment
        assignments.delete(giver.name);
        assignedRecipients.delete(recipient.name);
      }
    }

    return false; // No valid assignments for this giver
  }

  if (backtrack(0)) {
    return assignments; // Valid assignments found
  } else {
    throw new Error("No valid assignment is possible with the given constraints.");
  }
}


// Function to initialize the Secret Santa app
function initializeApp() {
  let assignments;
  try {
    assignments = generateAssignments(people);
    console.log("Assignments:", Object.fromEntries(assignments));
  } catch (error) {
    console.error(error.message);
    alert("Failed to generate assignments. Please check the participants.");
    return;
  }

  const nameList = document.getElementById("name-list");
  const resultSection = document.getElementById("result-section");
  const assignmentResult = document.getElementById("assignment-result");
  const backButton = document.getElementById("back-button");
  const doneSection = document.getElementById("done-section");

  // Populate the list of names
  function populateList() {
    nameList.innerHTML = "";
    people.forEach((person) => {
      if (!assignments.has(person.name)) return; // Skip if already clicked

      const li = document.createElement("li");
      li.textContent = person.name;
      li.addEventListener("click", () => handleNameClick(person));
      nameList.appendChild(li);
    });
  }

  // Handle clicking a name
  function handleNameClick(person) {
    const recipient = assignments.get(person.name);
    assignments.delete(person.name); // Remove from assignments

    nameList.style.display = "none";
    resultSection.style.display = "flex";
    backButton.style.display = "none"; // Hide the back button initially

    // Show "Making a List..." and "Checking it Twice..." messages
    assignmentResult.textContent = "Making a List...";
    setTimeout(() => {
      assignmentResult.textContent = "Checking it Twice...";
      setTimeout(() => {
        assignmentResult.innerHTML = `
          <p>${person.name} is buying for:</p>
          <p><strong>${recipient.toUpperCase()}</strong></p>
        `;
        backButton.style.display = "block"; // Show the back button
        backButton.disabled = false; // Enable back button after assignment is shown
      }, 1000); // Delay for "Checking it Twice..."
    }, 1000); // Delay for "Making a List..."

    backButton.disabled = true; // Disable back button initially

    backButton.onclick = () => {
      resultSection.style.display = "none";
      populateList();
      nameList.style.display = "block";

      // Check if all assignments are done
      if (assignments.size === 0) {
        showDoneSection(); // Show the "Done" section after all assignments
      }
    };
  }

  function showDoneSection() {
    nameList.style.display = "none";
    resultSection.style.display = "none";
    doneSection.style.display = "block"; // Show the "Done" screen
    const doneMessage = document.getElementById("done-message");
    doneMessage.textContent = "All assignments complete! Ready to start over?";
  }

  populateList();
}

function resetApp() {
  // Reset everything to start over
  initializeApp(); // Re-initialize the app
  const doneSection = document.getElementById("done-section");
  doneSection.style.display = "none"; // Hide the "Done" section
}

// Run the app
initializeApp();

  
  </script>
</body>
</html>
